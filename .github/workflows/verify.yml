name: Verify mathematical development
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check source layout and exact certificates
        run: |
          python3 scripts/check_sources.py
          python3 scripts/check_certificate.py
          python3 certificates/plateau/audit_odd.py
          python3 certificates/plateau/audit_even.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: lean
          build: true
      - name: Audit logical axioms
        run: python3 scripts/check_axioms.py
      - name: Enable Comparator sandbox on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare statement and proof with the bundled kernels
        run: ./scripts/verify_comparator.sh
