# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"
project:
  name: "Self-similar counterexamples to three conjectures of Lorentz"
  description: >-
    Three continuous counterexamples in uniform polynomial approximation:
    a nonodd function whose best approximants all vanish at zero, a nonodd
    function with plateaus at degrees (2k+1,2k+2), and a noneven function
    with plateaus at degrees (2k,2k+1). Exact algebraic certificates, analytic
    contact persistence, and cubic self-similarity prove all three results.
  authors: ["TEMPLATE: author names to be supplied by the owner"]
  license: "TEMPLATE: license to be selected by the owner"
  responsible_maintainers: ["TEMPLATE: maintainer names to be supplied by the owner"]
classification:
  arxiv: ["math.CA"]
  msc2020: ["41A10", "41A50", "68V15"]
sources:
  - title: "Self-similar counterexamples to three conjectures of Lorentz"
    type: "manuscript"
    location: "paper/lorentz_counterexamples.tex, Parts I and II, in this repository snapshot"
    relationship: "formalizes"
    note: >-
      Combined and revised from the supplied construction manuscripts, whose
      original files are preserved under archive/. Bibliographic authorship
      of the supplied manuscripts remains to be confirmed by the owner.
    license: "unknown"
related_formalizations: []
status:
  scope: >-
    All three counterexample existence theorems are fully proved for
    sufficiently small positive perturbations. Every finite table identity
    and inequality is checked in Lean and connected to the analytic proof.
    The manuscript's explicit numerical perturbation sizes are not Lean
    endpoint claims. The three deliberate Challenge holes are not included
    in the proof-development sorry count.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
automation:
  methods:
    - method: "agent"
      models: ["GPT-6"]
      framework: "OpenAI Codex"
      tool_setup: >-
        Local Lean and Lake, Mathlib proof-producing tactics, kernel-reduced
        rational coefficient checks, and independent Python Fraction audits.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux workstation"
      prompting_notes: >-
        The owner requested proof audits, proof optimization, formalization
        of companion constructions, repository organization, and preparation
        for Palomar submission.
  spend_usd: "not tracked"
  notes: >-
    The owner supplied the mathematical construction PDFs, Lean project,
    and companion certificate package. The agent audited, revised, optimized,
    ported, and packaged the development. The provenance of the incoming
    artifacts is retained; their earlier automation history was not supplied.
fidelity:
  divergences: >-
    The Lean endpoints prove existence of sufficiently small positive
    perturbations rather than the manuscript's explicit numerical sizes.
    The original PDF's strict Lipschitz inequality at coincident points was
    corrected to a non-strict inequality.
review:
  status: "agent-audited; human mathematical review not recorded"
  reviewers: []
  notes: >-
    The source and theorem statement were inspected, exact rational audits
    were run, and all three complete Lean endpoints were kernel checked.
    The current verification records distinguish historical checks from the
    migrated toolchain and Comparator checks. No independent human review
    or endorsement is asserted.
alignment:
  namespace: "LorentzSubmission"
  statements:
    - source: "Combined manuscript, Part I, main common-origin theorem"
      lean: "LorentzSubmission.common_origin_counterexample"
      module: "Solution"
      status: "proved"
      note: "Existential positive perturbation; genuine minimax condition at every degree."
    - source: "Combined manuscript, Part II, oddness plateau counterexample"
      lean: "LorentzSubmission.odd_plateau_counterexample"
      module: "Solution"
      status: "proved"
      note: "Existential positive perturbation; all pairs (2k+1,2k+2), with uniqueness."
    - source: "Combined manuscript, Part II, evenness plateau counterexample"
      lean: "LorentzSubmission.even_plateau_counterexample"
      module: "Solution"
      status: "proved"
      note: "Existential positive perturbation; all pairs (2k,2k+1), with uniqueness."
acknowledgements: "Lean, Mathlib, and the Lean 4 skills tooling."
